expert_time_estimate_hours = 40.0
difficulty_explanation = "This synthetic but operationally realistic instance requires a computational-geometry or robotics engineer to reduce continuous visibility along a 23-segment route amid 168 closed boundary edges and 56 restricted observers to an exact minimal arrangement. Collinear walls, vertex grazing, included FOV boundaries, simultaneous events, and singleton visibility make floating-point sampling wrong. Scheduling is no longer an ordinary shortest path: every closed cell needs an ordered visible primary/backup pair from different failure domains, each observer obeys a sliding fatigue limit, and two directed transition streams interact with a global load-balancing objective. The five-level optimum fixes transition cost before peak load, pair-handoff events, role changes, and a full variable-domain cell-pair vector. Keeping only one best prefix per current pair is unsound because different fatigue/load histories have different futures; locally optimizing either role or each objective independently also fails."
solution_explanation = "Construct every observer's exact visibility profile from route intersections with FOV boundary lines and observer-vertex lines, evaluate rational point and open-cell predicates, and retain only genuine global changes. Intersect each open set with both endpoint sets to obtain closed-cell availability. Enumerate ordered visible pairs with distinct failure domains. A CP-SAT model chooses one pair per cell, applies sliding-window fatigue constraints, tabulates legal/costed transitions for both roles, and bounds every observer load by a shared maximum. Encode the first four bounded priorities into one dominance-weighted integer whose coefficients make lower levels incapable of offsetting one unit at a higher level. Fix those optima, then minimize each chronological pair code with the proven prefix fixed to obtain the unique fifth-level vector. Merge adjacent equal pairs for the schedule and serialize exact rationals."
verification_explanation = "The verifier pins the generated facility bytes, validates the exact schema and canonical rational partition, checks every point/open visibility set against the readable verifier-only reference, and proves the submitted paired ranges cover the domain. It independently checks both observers' closed-range visibility, distinct failure domains, every changed role's directed transition and cost, maximal merging, closed-cell loads, all sliding fatigue windows, handoff-event and role-change totals, and the full cell-pair sequence. Each of the five objective components is compared to the readable expected fixture, followed by a localized field-by-field comparison of the complete artifact."

