difficulty_explanation = "This synthetic but operationally realistic instance requires a computational-geometry or robotics engineer to reduce continuous visibility along a 23-segment route amid 168 closed boundary edges and 32 restricted observers to an exact minimal arrangement. Collinear walls, vertex grazing, included FOV boundaries, simultaneous events, and singleton visibility make floating-point sampling or interval-only representations wrong. The 76 resulting critical cells then couple to 219 directed, weighted compatibility transitions: an observer must cover each closed cell, both sides must see every handoff instant, and the schedule is optimized by cost, handoffs, a variable-length observer sequence, and finally its exact handoff-time vector. Geometry and optimization errors both yield plausible schedules, so neither half can be approximated independently."
solution_explanation = "For each observer, intersect every route segment exactly with its FOV boundary lines and with lines through the observer and every polygon vertex. Evaluate visibility using rational orientation predicates at each candidate and one interior point per adjacent open cell, retaining only actual point/side changes. Union observer changes and remove globally irrelevant simultaneous events to obtain the exact minimal decomposition. For each closed cell, intersect its open-interval set with both endpoint sets. Run dynamic programming over these cell layers using allowed directed transitions, carrying total cost, handoff count, compressed observer sequence, and exact handoff-time vector as the ordered objective. Backtrack assignments, merge equal neighbors, and serialize all rational values canonically."
verification_explanation = "The verifier confirms /app/input/facility.json is byte-identical, checks /app/output.json and every nested record against the documented schema, parses every rational into reduced canonical form, validates the complete ordered point/open partition and critical-time minimality, checks sorted observer sets, proves the submitted closed ranges cover the domain using only reported visibility, validates each directed handoff and recomputes its cost, reconciles the normalized sequence and exact handoff-time vector, checks all four objective components against a readable verifier-only reference, and compares the complete structure field by field while reporting the first differing section or array index."

