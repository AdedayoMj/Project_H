artifacts = ["/app/output.json"]  # paths the verifier reads from the agent (e.g. ["/app/output.json"]) — must be above the first [section]

[task]
name = "dynamo/exec-schedule-triage"  # required format: org/name (Harbor needs the slash); name part lowercase kebab-case, <=3 words
description = "Expand recurring executive calendars, resolve interacting scheduling policy conflicts, and triage inbox replies."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Personal Assistant Productivity"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["optimize", "analyze"]                # e.g. ["implement", "debug"]
artifact_type = ["generated_output_artifact"]                 # e.g. ["codebase", "configuration_file"]
expert_time_estimate_hours = 10.0     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "Solving this requires modeling protected/VIP exceptions, directional travel buffers, dependencies, local-time RRULE expansion across three DST regions, overlapping quotas, and a five-stage lexicographic objective together. Two dense clusters contain 26 and 28 movable meetings with close priorities. Cardinality portfolios constrain each day, while three weighted attendance budgets, three exact placement-resource budgets, and two placement-triggered commitments span both dates. Placement-resource contributions depend on both event identity and the distinct candidate-slot rank, so selection cannot be optimized before placement; one cross-date implication binds through two downstream slot choices while another changes the optimum by making its trigger undesirable. Independently optimal days cannot be combined, and a model that enforces only one placement, NoOverlap, and event-level quotas remains invalid. The solver must preserve recurrence, protected-rule, slot-rank, reification, and sequential-objective semantics across over 200 occurrences and 24 messages. One missed coupling or DST endpoint changes the exact artifact. This synthetic scenario mirrors portfolio balancing, preparation capacity, and linked attendance commitments handled by a chief of staff."
solution_explanation = "The reference expands events with dateutil.rrule and zoneinfo, removes EXDATEs, builds legal distinct placements, and joins occurrences that conflict, depend on one another, or share any event-level or placement-level rule. Small components are searched exhaustively. The cross-date dense component uses CP-SAT Booleans per placement with at-most-one selection, NoOverlap, dependency exclusions, cardinality and weighted bounds, three exact sums of event base units plus chosen-rank adjustments, and reified event/slot commitments. It optimizes priority, lateness, and moved count sequentially and confirms uniqueness. Component candidates are combined to minimize travel and apply the occurrence-rank tie-break; inbox messages use the disclosed ordered rules."
verification_explanation = "The verifier requires exact structural equality with the reference artifact: scheduled occurrences and actual placements, moved/deferred sets, all reply categories, and all objective fields. It byte-compares /app/input/ with a golden copy, directly recomputes event-level weighted portfolios, reconstructs each chosen distinct placement rank from calendar data, recomputes all placement-resource totals, and checks active placement commitments before exact matching."

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at /tests only at verify time; leave environment_mode unset for this shared model.

[agent]
timeout_sec = 3600.0                # ensure failures reflect scheduling logic rather than runtime

[environment]
build_timeout_sec = 600.0          # max seconds for the Docker build
cpus = 4                           # parallel exact search within common local/CI capacity
memory_mb = 2048                   # increase for large datasets or in-memory processing
storage_mb = 10240                 # increase for tasks with large files or build artifacts
gpus = 0                           # max 1, expect H100
allow_internet = true              # open internet is available to the agent
mcp_servers = []                   # optional MCP servers to expose to the agent
