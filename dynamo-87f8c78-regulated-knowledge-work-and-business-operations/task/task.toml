artifacts = ["/app/output.json"]  # paths the verifier reads from the agent (e.g. ["/app/output.json"]) — must be above the first [section]

[task]
name = "dynamo/exec-schedule-triage"  # required format: org/name (Harbor needs the slash); name part lowercase kebab-case, <=3 words
description = "Expand recurring executive calendars, resolve interacting scheduling policy conflicts, and triage inbox replies."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Personal Assistant Productivity"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["optimize", "analyze"]                # e.g. ["implement", "debug"]
artifact_type = ["generated_output_artifact"]                 # e.g. ["codebase", "configuration_file"]
expert_time_estimate_hours = 6.0     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "Solving this requires modeling constraints that only produce the correct answer when applied jointly: protected/VIP exceptions, directional travel buffers, dependencies, local-time RRULE expansion across three DST regions, overlapping portfolio quotas, conditional follow-through commitments, and a five-stage lexicographic objective. Most events form small conflict components, but two dense same-venue clusters contain 26 and 28 movable meetings with deliberately close priorities. Each dense cluster now also carries several overlapping minimum/maximum selection portfolios plus a conditional commitment whose trigger and required members compete for the same limited time window. This turns the clusters from ordinary multiple-choice weighted interval scheduling into globally coupled 0-1 optimization problems: a monolithic CP-SAT model that only enforces one placement and NoOverlap still returns a feasible, high-scoring, but invalid schedule, while decomposition that ignores the overlapping rules is unsound. The solver must recognize every disclosed policy table, couple the relevant event variables, preserve exact recurrence and protected-rule semantics, and optimize each objective stage in order. With over 200 occurrences and 24 messages graded by exact match, one missed coupling, DST endpoint, or placement-rank detail changes the artifact. This mirrors portfolio balancing and conditional attendance commitments handled by a chief of staff, and requires careful constraint modeling rather than brute force or a generic calendar optimizer."
solution_explanation = "The reference expands events with dateutil.rrule and zoneinfo, removes EXDATEs, builds legal placements, and connects occurrences that can conflict, depend on one another, or share a portfolio/conditional rule. Small components are searched exhaustively. The two dense components use OR-Tools CP-SAT with one Boolean per placement, at-most-one placement per occurrence, NoOverlap, dependency exclusions, every overlapping portfolio cardinality bound, and reified conditional-commitment minima. It optimizes priority, lateness, and moved count sequentially and verifies the component optimum is unique. Component candidates are then combined to minimize travel and apply the occurrence-rank tie-break. Inbox messages are classified by the disclosed ordered rules."
verification_explanation = "A hidden verifier (not visible to the agent) compares /app/output.json against a precomputed reference fixture produced by the reference solver, requiring exact structural equality: the same set of scheduled occurrences (with their actual start/end/venue), the same moved and deferred occurrence_id sets, the same reply_categories mapping, and the same objective_score. It also byte-compares every file under /app/input/ against a golden copy to catch input tampering."

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at /tests only at verify time; leave environment_mode unset for this shared model.

[agent]
timeout_sec = 3600.0                # ensure failures reflect scheduling logic rather than runtime

[environment]
build_timeout_sec = 600.0          # max seconds for the Docker build
cpus = 1                           # increase for parallel/compute-heavy workloads
memory_mb = 2048                   # increase for large datasets or in-memory processing
storage_mb = 10240                 # increase for tasks with large files or build artifacts
gpus = 0                           # max 1, expect H100
allow_internet = true              # open internet is available to the agent
mcp_servers = []                   # optional MCP servers to expose to the agent
