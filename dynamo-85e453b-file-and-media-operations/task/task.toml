artifacts = ["/app/output.json"]

[task]
name = "dynamo/defensible-esi-cull"
description = "Produce an exact, auditable ESI production set from a contaminated custodian collection."

[metadata]
category = "File and Media Operations"
subcategory = "File search and filtering"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 16.0
difficulty_explanation = "An e-discovery or digital-forensics engineer must inventory 1,842 logical items without following hostile symlinks; distinguish hardlinks; classify misleading, polyglot, and OOXML files by mandated signature precedence; recurse bounded ZIPs; extract three embedded-date formats across DST folds; search normalized UTF-8, UTF-16LE, and Latin-1 text; normalize only text-family hashes; propagate privilege across attachment families; re-elect global duplicate representatives; and pack whole families into deterministic volumes. These rules interact: classification controls atomicity and extraction, embedded dates control eligibility, family privilege outranks date and responsiveness, and deduplication happens only after those removals. A plausible one-pass filename/search pipeline produces hundreds of credible but wrong records."
solution_explanation = "Inventory with lstat and bytewise path ordering, grouping regular paths by device and inode before reading canonical files. Classify leading bytes in protocol order, identify OOXML from ZIP members, and lazily recurse true archives with physical ZIPs at depth 0, direct members at depth 1, and inclusive depth and size limits. Strip signature BOMs before decoding text, extract PDF, OOXML, and EXIF dates into UTC, normalize searchable text, compute media-dependent hashes, and derive family and custodian attributes. Apply technical dispositions, family-wide privilege, date and responsiveness, then elect one survivor per normalized hash by the four-part rank. Bundle produced survivors by family, next-fit those bundles into volumes, and emit the ordered production, privilege, exclusion, and reconciled summary records."
verification_explanation = "The verifier checks that /app/output.json is a regular JSON object with the exact documented schemas and canonical field types; independently fingerprints /app/corpus/ content, topology, hardlink grouping, modes, sizes, timestamps, and symlink targets plus every /app/input/ file; verifies the production/exclusion partition, privilege-log reconciliation, duplicate pointers, counters, volume accounting, capacity, and family atomicity; then compares a canonical SHA-256 of the complete submitted structure with a deterministic reference result generated by the reference implementation."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
