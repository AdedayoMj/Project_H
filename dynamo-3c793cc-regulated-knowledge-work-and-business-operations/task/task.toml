artifacts = ["/app/output.json"]  # paths the verifier reads from the agent (e.g. ["/app/output.json"]) — must be above the first [section]

[task]
name = "dynamo/te-reimbursement-audit"  # required format: org/name (Harbor needs the slash); name part lowercase kebab-case, <=3 words
description = "Compute an exact international T&E audit, then jointly optimize closeout, sixteen adverse recoveries, and a schedulable shared certification reserve."                 # one-line summary of the task

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Personal Assistant Productivity"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["analyze", "optimize"]                # e.g. ["implement", "debug"]
artifact_type = ["generated_output_artifact"]                 # e.g. ["codebase", "configuration_file"]
expert_time_estimate_hours = 40.0     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "This hand-constructed synthetic audit models compliance-adjacent work a T&E analyst and operations-research engineer must defend exactly. Seventy-nine rows first pass through interacting exclusions, VAT gating, two-hop dated FX with per-hop rounding, caps, fee eligibility, directional mileage, proration, anti-double-dip, and running approval thresholds. Closeout couples a 75-variable primary selection to sixteen adverse post-close scenarios through one small recovery reserve. Every scenario removes two mandatory-primary claims, permits only bounded reactivation, lowers the cap, adjusts four portfolio floors, and re-evaluates seven commitments plus eighteen overlapping threshold bonuses. Orthogonally, every reserve choice must admit an exact assignment across release-dated reviewer periods with category eligibility, certification-unit capacities, conditional precedences, and separation bands. Eight minimax/aggregate objectives precede a global primary/recovery/schedule canonical walk. Solving scenarios independently, scheduling after optimization, blending objective levels, or accepting an arbitrary optimum changes exact statuses, reserve choices, recoveries, or assignments. A qualified analyst-programmer should need roughly 40 focused hours."
solution_explanation = "Apply the disclosed audit chain to compute pre-deferral cents, per diem, and approval flags. Build one CP-SAT primary Boolean per surviving claim, retained Booleans per claim/scenario, a reserve-union Boolean per claim, and optional reviewer-period assignment Booleans. Constrain unavailable claims into primary and out of recovery, bound reactivations, equate reserve membership to their cross-scenario union, impose reserve and reviewer-period capacities, releases, conditional precedences, separation bands, scenario-adjusted caps and portfolio floors, commitments, and reified coverage rules. Sequentially maximize all eight disclosed objectives. Fix them, greedily test primary decisions in date/line order, recovery decisions in scenario/date/line order, and certification options in period/reviewer order. Emit primary dispositions and the canonical coupled reserve, recovery, and certification ledgers."
verification_explanation = "The verifier checks exact schema/types, byte-compares /app/input/ with a hidden golden copy, requires all 79 line IDs exactly once in CSV order, and independently verifies boundary-day per diem and primary totals. It recomputes primary portfolios, commitments, priority, and coverage. For all sixteen recoveries it verifies losses, deferred-only bounded reactivation, reduced caps, adjusted portfolio floors, commitments, priority, and coverage. It reconciles the reserve union and certification load, then independently checks every certification release, reviewer/category match, reviewer-period capacity, conditional precedence, separation band, assignment score, and aggregate. Finally it compares every line, reserve, recovery, certification assignment, and summary value exactly with the reference fixture; there is no tolerance."

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at verify time; leave environment_mode unset for this shared model.

[agent]
timeout_sec = 3600.0                # raise for hard tasks — agents may run for many minutes or hours

[environment]
build_timeout_sec = 600.0          # max seconds for the Docker build
cpus = 4                           # parallel exact search for the constrained retention model
memory_mb = 2048                   # increase for large datasets or in-memory processing
storage_mb = 10240                 # increase for tasks with large files or build artifacts
gpus = 0                           # max 1, expect H100
allow_internet = true              # open internet is available to the agent
mcp_servers = []                   # optional MCP servers to expose to the agent
