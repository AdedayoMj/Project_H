artifacts = ["/app/output.json"]  # paths the verifier reads from the agent (e.g. ["/app/output.json"]) — must be above the first [section]

[task]
name = "dynamo/te-reimbursement-audit"  # required format: org/name (Harbor needs the slash); name part lowercase kebab-case, <=3 words
description = "Compute exact per-line reimbursement and compliance disposition for an international business trip against a multi-clause T&E expense policy, then optimally trim the trip to its reimbursement budget."                 # one-line summary of the task

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Personal Assistant Productivity"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["analyze", "optimize"]                # e.g. ["implement", "debug"]
artifact_type = ["generated_output_artifact"]                 # e.g. ["codebase", "configuration_file"]
expert_time_estimate_hours = 14.0     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "This deliberately hand-constructed synthetic audit models compliance-adjacent work a T&E analyst or chief-of-staff must defend exactly. The 79 rows first pass through interacting exclusions, VAT gating, two-hop dated FX with per-hop rounding, meal/airfare caps, fee eligibility, directional mileage, boundary-day per-diem proration, anti-double-dip, and running approval thresholds. The closeout then has 75 surviving binary decisions: enumeration is 2^75 and meet-in-the-middle still needs about 2^37 states. Four overlapping weighted portfolios bind at floors, caps, or an exact target; seven bounded conditional commitments couple distant claims; and eighteen overlapping threshold-coverage programs create reified bonus variables. The four-level optimum maximizes priority weight, then realized coverage score, then retained cents under a near-tight cap, then the date/line retention vector. Greedy selection, one-way bonus implications, unbounded commitments, blended objectives, or arbitrary optimum reconstruction changes exact statuses, score, or totals. The data mirrors limited funding pools, linked tickets, program-continuity goals, and audit-capacity balancing; a qualified analyst-programmer should need roughly 14 focused hours."
solution_explanation = "Apply exclusions in precedence order, derive each surviving amount with VAT subtraction, dated two-hop FX and rounding, caps, fee rules, or directional mileage, then compute per diem and approval flags. For closeout, create one Boolean per surviving line, constrain retained cents plus per diem to the cap, add every portfolio band, and reify each triggered companion-count lower and upper bound. For every coverage program create a Boolean equivalent to its retained-count threshold and sum its points. Optimize priority weight, coverage score, and retained cents sequentially with CP-SAT. Fix all three optima, then walk lines in (date,line_id) order, forcing retention whenever feasibility remains to obtain the unique fourth-level vector. Deferred lines receive zero; summaries use kept lines and report the realized coverage score."
verification_explanation = "The verifier checks the required file and exact schema/types, byte-compares /app/input/ with a hidden golden copy, requires all 79 line IDs exactly once in CSV order, and independently verifies the boundary-day prorated per diem. It recomputes final, flagged, deferred, and per-category totals, checks the cap, directly recomputes every weighted portfolio and active bounded commitment, and independently reconciles every overlapping coverage threshold and the reported score. It then compares every line amount/status and every summary field exactly with the reference fixture produced by solution/solve.py; there is no tolerance. The constrained optimizer was also checked against exhaustive enumeration on smaller generated instances."

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at verify time; leave environment_mode unset for this shared model.

[agent]
timeout_sec = 3600.0                # raise for hard tasks — agents may run for many minutes or hours

[environment]
build_timeout_sec = 600.0          # max seconds for the Docker build
cpus = 4                           # parallel exact search for the constrained retention model
memory_mb = 2048                   # increase for large datasets or in-memory processing
storage_mb = 10240                 # increase for tasks with large files or build artifacts
gpus = 0                           # max 1, expect H100
allow_internet = true              # open internet is available to the agent
mcp_servers = []                   # optional MCP servers to expose to the agent
