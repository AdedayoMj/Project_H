artifacts = ["/app/output.json"]  # paths the verifier reads from the agent (e.g. ["/app/output.json"]) — must be above the first [section]

[task]
name = "dynamo/te-reimbursement-audit"  # required format: org/name (Harbor needs the slash); name part lowercase kebab-case, <=3 words
description = "Compute exact per-line reimbursement and compliance disposition for an international business trip against a multi-clause T&E expense policy, then optimally trim the trip to its reimbursement budget."                 # one-line summary of the task

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Personal Assistant Productivity"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["analyze", "optimize"]                # e.g. ["implement", "debug"]
artifact_type = ["generated_output_artifact"]                 # e.g. ["codebase", "configuration_file"]
expert_time_estimate_hours = 10.0     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "This deliberately hand-constructed synthetic audit models compliance-adjacent work a T&E analyst or chief-of-staff must defend exactly. The 79 rows first pass through interacting exclusions, VAT gating, two-hop dated FX with per-hop rounding, meal/airfare caps, fee eligibility, directional mileage, per-diem anti-double-dip, and running approval thresholds. The closeout then has 75 surviving binary retention decisions: plain enumeration is 2^75 and meet-in-the-middle still needs about 2^37 states. It is not an ordinary knapsack: four overlapping weighted retention portfolios bind at a floor, cap, or exact target, while three conditional claim bundles couple distant meal and airfare lines. The optimum must maximize retained priority weight, then retained cents under a cap with only 37 cents of slack, then apply a date/line retention tie-break. Two fare alternatives have identical amount, priority, and policy units while exactly one must be retained, making that final tie-break decisive. Greedy selection, independent portfolio handling, an un-reified implication, or DP that reconstructs an arbitrary optimum changes at least one exact status or total. The synthetic data mirrors limited funding pools, linked ticket claims, and audit-capacity balancing in an executive trip closeout; a qualified analyst-programmer should need roughly 10 focused hours."
solution_explanation = "Apply exclusions in precedence order, then derive each surviving amount with VAT subtraction, dated two-hop FX and rounding, category caps, fee rules, or directional mileage. Compute per diem by day and subtract that day's pre-deferral reimbursable meals, then flag approvals in category/date/line order. For budget closeout, create one Boolean per surviving line. Constrain retained amount plus per diem to the trip cap; add every weighted portfolio floor/cap and reify each retention commitment from its trigger to the required companion count. Optimize retained priority weight and retained cents sequentially with CP-SAT. Fix both optima, then walk lines in (date,line_id) order, forcing retention whenever feasibility remains, which resolves the deliberately symmetric airfare pair and produces the unique artifact. Deferred lines receive zero and DEFERRED_OVER_BUDGET; summaries use kept lines only."
verification_explanation = "The verifier atomically checks the required file and exact schema/types, byte-compares /app/input/ with a hidden golden copy, covers all 79 line IDs exactly once, verifies cap and deferred-list consistency, and directly recomputes every weighted retention portfolio and active conditional bundle from the submitted retained set. It then compares every line amount/status and every summary field exactly, order-independently by line_id, with the reference fixture produced by solution/solve.py; there is no tolerance. The constrained optimizer was also checked against exhaustive enumeration on smaller generated instances, while the full 75-decision instance is solved by the same generic model rather than hard-coded answers."

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at verify time; leave environment_mode unset for this shared model.

[agent]
timeout_sec = 3600.0                # raise for hard tasks — agents may run for many minutes or hours

[environment]
build_timeout_sec = 600.0          # max seconds for the Docker build
cpus = 4                           # parallel exact search for the constrained retention model
memory_mb = 2048                   # increase for large datasets or in-memory processing
storage_mb = 10240                 # increase for tasks with large files or build artifacts
gpus = 0                           # max 1, expect H100
allow_internet = true              # open internet is available to the agent
mcp_servers = []                   # optional MCP servers to expose to the agent
