artifacts = ["/app/output.json"]  # paths the verifier reads from the agent (e.g. ["/app/output.json"]) — must be above the first [section]

[task]
name = "dynamo/te-reimbursement-audit"  # required format: org/name (Harbor needs the slash); name part lowercase kebab-case, <=3 words
description = "Compute an exact international T&E audit, then jointly optimize its primary budget closeout and limited post-close recoveries under ten claim-rejection scenarios."                 # one-line summary of the task

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Personal Assistant Productivity"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["analyze", "optimize"]                # e.g. ["implement", "debug"]
artifact_type = ["generated_output_artifact"]                 # e.g. ["codebase", "configuration_file"]
expert_time_estimate_hours = 28.0     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "This hand-constructed synthetic audit models compliance-adjacent work a T&E analyst and operations-research engineer must defend exactly. Seventy-nine rows first pass through interacting exclusions, VAT gating, two-hop dated FX with per-hop rounding, caps, fee eligibility, directional mileage, proration, anti-double-dip, and running approval thresholds. Closeout then couples a 75-variable primary selection to ten adverse post-close scenarios through a shared certification-limited recovery reserve. Every scenario removes two mandatory-primary claims, retains all other primary choices, permits only a small recovery from deferred claims, lowers the cap, adjusts portfolio floors, and re-evaluates seven conditional commitments plus eighteen overlapping threshold bonuses. Seven exact minimax/aggregate lexicographic objectives precede a global canonical walk over primary and recovery decisions. Solving scenarios independently, greedily repairing losses, blending objectives, or reconstructing arbitrary optima changes exact primary statuses, the common reserve, or contingency plans. A qualified analyst-programmer should need roughly 28 focused hours."
solution_explanation = "Apply the disclosed audit chain to compute pre-deferral cents, per diem, and approval flags. Build one CP-SAT primary Boolean per surviving claim, one retained Boolean per claim/scenario, and one reserve-union Boolean per claim. Constrain every unavailable claim into the primary and out of its recovery; link every other recovery Boolean above its primary Boolean, bound reactivations, equate the reserve to their cross-scenario union, cap certification load, and impose scenario-adjusted caps and portfolio floors plus all commitment and reified coverage rules. Sequentially maximize worst recovery priority, primary priority, worst recovery coverage, total recovery coverage, primary coverage, worst recovery amount, and primary amount. Fix all optima, greedily test primary decisions in date/line order, then recovery decisions in scenario/date/line order. Emit primary dispositions and the canonical reserve/recovery ledger."
verification_explanation = "The verifier checks the required exact schema/types, byte-compares /app/input/ with a hidden golden copy, requires all 79 line IDs exactly once in CSV order, and independently verifies boundary-day per diem and primary totals. It recomputes primary portfolios, commitments, priority, and coverage. For every recovery it verifies mandatory losses, deferred-only bounded reactivation, reduced cap, adjusted portfolio floors, commitments, priority, and coverage; it also reconciles the shared reserve union, certification limits, and all worst-case/aggregate fields. Finally it compares every line amount/status, reserve choice, recovery decision, and summary value exactly with the reference fixture produced by solution/solve.py; there is no tolerance."

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at verify time; leave environment_mode unset for this shared model.

[agent]
timeout_sec = 3600.0                # raise for hard tasks — agents may run for many minutes or hours

[environment]
build_timeout_sec = 600.0          # max seconds for the Docker build
cpus = 4                           # parallel exact search for the constrained retention model
memory_mb = 2048                   # increase for large datasets or in-memory processing
storage_mb = 10240                 # increase for tasks with large files or build artifacts
gpus = 0                           # max 1, expect H100
allow_internet = true              # open internet is available to the agent
mcp_servers = []                   # optional MCP servers to expose to the agent
