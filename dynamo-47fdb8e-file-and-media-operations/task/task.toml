[task]
name = "dynamo/carton-plate-recovery"
description = "Recover a semantically editable folding-carton production package from corrupted print evidence."

[metadata]
category = "File and Media Operations"
subcategory = "Image and design processing"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["recover_or_repair_artifact", "transform", "build_or_package"]
artifact_type = ["media_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 40.0
difficulty_explanation = "A senior packaging-prepress or computational-imaging engineer must recover seven coupled production plates from 56 anonymously named scans. Every scan has a different cubic spatial warp, eight high-confidence fiducial outliers, nonlinear dot gain, and scanner noise; half also contain two independent occlusions, and every ink label is false and must instead be resolved from contaminated spectral samples. Successful reconstruction requires robust model fitting, inverse resampling, photometric calibration, globally consistent redundant fusion, exact text and QR recovery, linear-light overprint rendering, and production-semantic SVG/PDF authoring. Local registration, filename trust, gamma-space compositing, deriving the opaque-white plate from visible ink, or flattening the design all yield credible but measurably wrong artifacts."
solution_explanation = "Classify scans by robust spectral proximity to the trusted ink registry. For each scan, use outlier-resistant fitting of the disclosed total-degree-three basis to recover its image-to-master map, fit or numerically solve the inverse map, use the redundant tone wedge to invert scanner density, and resample valid pixels onto the master grid. Fuse overlapping observations per plate while respecting alpha occlusions. Recover text and QR values by redundancy, render the proof from the fused coverages in the ticket's linear working model, and emit the exact audit manifest. Build an editable semantic SVG from the supplied frames and dieline, then package the proof, embedded live fonts, ICC output intent, spot Separation spaces, boxes, and optional-content roles into the PDF/X-4 artifact."
verification_explanation = "The verifier fingerprints all agent-visible inputs; validates every artifact as a regular file and the NPZ/JSON schemas; and compares each submitted plate with a hidden deterministic master using the disclosed solid-mask IoU, area, and symmetric boundary tolerances. It independently rerenders the submitted plates, requires pixel identity with the submitted proof, and measures hidden-master ΔE00 and multiscale SSIM. It compares the complete manifest audit trail, parses the SVG for live text, vector QR modules, semantic roles, and equivalent dieline geometry, and parses and renders the PDF to verify page boxes, PDF/X metadata, embedded four-channel ICC profile, embedded fonts, extracted text, spot Separation spaces, optional-content roles, and visual agreement with the proof."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 3600.0

