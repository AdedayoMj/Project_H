[task]
name = "dynamo/carton-plate-recovery"
description = "Recover a semantically editable folding-carton production package from corrupted print evidence."

[metadata]
category = "File and Media Operations"
subcategory = "Image and design processing"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["recover_or_repair_artifact", "transform", "build_or_package"]
artifact_type = ["media_artifact", "generated_output_artifact"]
expert_time_estimate_hours = 40.0
difficulty_explanation = "A senior packaging-prepress or computational-imaging engineer must recover seven coupled production plates from deterministic synthetic evidence generated from a valid hidden production master and then damaged with realistic migration and scanning defects. The 56 anonymously named scans each have a different cubic spatial warp, eight high-confidence fiducial outliers, nonlinear dot gain, and scanner noise; half also contain two independent occlusions, and every ink label is false and must instead be resolved from contaminated spectral samples. Successful reconstruction requires robust model fitting, inverse resampling, photometric calibration, globally consistent redundant fusion, exact text and QR recovery, linear-light overprint rendering, and production-semantic SVG/PDF authoring. Local registration, filename trust, gamma-space compositing, deriving the opaque-white plate from visible ink, or flattening the design all yield credible but measurably wrong artifacts."
solution_explanation = "Classify every scan by taking the component-wise median of its nine Lab samples, measuring Euclidean CIE Lab distance to each trusted reference, selecting the minimum-distance plate, and using manifest plate order for an exact tie. For each scan, use outlier-resistant fitting of the disclosed total-degree-three basis to recover its image-to-master map, fit or numerically solve the inverse map, use the redundant tone wedge to invert scanner density, and resample valid pixels onto the master grid. Fuse overlapping observations per plate while respecting alpha occlusions. Recover text and QR values by redundancy, render the proof from the fused coverages in the ticket's linear working model, and emit the exact audit manifest. Build an editable semantic SVG from the supplied frames and dieline, then package the proof, embedded live fonts, ICC output intent, spot Separation spaces, boxes, and optional-content roles into the PDF/X-4 artifact."
verification_explanation = "The digest-pinned base copies repository-owned font and ICC fixture assets into the image, and the build verifies both font files and the authoritative ICC profile against committed SHA-256 values before generating evidence. The verifier fingerprints all agent-visible inputs; validates the five regular artifacts and exact NPZ/JSON schemas; compares plates with the hidden master; independently rerenders their proof; checks the complete audit manifest and editable SVG semantics; and parses, structurally audits, and rasterizes the PDF. Its inequality bands were calibrated on direct master-grid outputs, the recovered oracle, independent float64 polynomial-fit/inverse-resampling and render variants, and targeted wrong-registration, missing-object, wrong-ink, background-haze, localized-wrong-tint, gamma-space, and flattened-PDF controls—not only on one reference serialization. Solid-mask IoU >=0.995 permits at most the sub-percent threshold flips produced along antialiased edges by otherwise sound inverse-map and fusion choices, while rejecting lost or substituted artwork; area error <=0.002 separately prevents compensating overfill and underfill from hiding behind overlap. Coverage values are also measured over every hidden-master region carrying a declared nominal level: zero-ink regions use mean absolute error <=1.25 code values to admit sparse inverse-resampling edge spill while rejecting low-level contamination spread across the background; nonzero nominal regions use mean absolute error <=12 and median absolute error <=1 code value. A separate localized-background guard labels every 8-connected nonzero submitted pixel over a hidden-master zero-ink background, limits every coherent component to 4.0 square millimetres, and limits their aggregate area to 36.0 square millimetres. The recovered oracle's largest such component is 1.73 square millimetres and its worst aggregate area is 30.13 square millimetres, leaving 19.5 percent measured headroom. The reported 184.7-square-millimetre coverage-15 contamination exceeds the component limit by more than forty-six times, while a distributed varnish control covering 39.43 square millimetres in isolated 0.00179-square-millimetre components adds only 0.195 mean code value yet is rejected by the aggregate cap. Nonzero nominal interiors also limit both every 8-connected >=2-code-value defect and the aggregate area of all such defects to 4.0 square millimetres. A nominal feature too thin to survive the boundary exclusion is instead checked over its complete mask with both a 5.0-square-millimetre aggregate cap and a 30 percent substantial-error-fraction cap; the oracle's K=110 crease guides have 2.55 square millimetres of >=2-code-value reconstruction error across 10.43 square millimetres of nominal feature, leaving measured headroom while rejecting removal or material corruption of the guides. The recovered oracle's worst nominal-region mean is 9.13, every region median is 0, and its worst broad-region aggregate substantial-error area is 3.77 square millimetres, preserving measured reconstruction headroom while rejecting uniform two-code-value shifts and multiple disconnected wrong-tint patches. Uniform background value 8 and the targeted 210-to-255 yellow-tint control exceed these limits by wide margins. The 0.16 mm symmetric boundary bound equals 3.78 pixels at the task's 600 dpi, accommodating contour quantization and the bounded residuals observed across calibrated inverse-resampling variants while limiting every local contour excursion; the paired IoU check supplies the global discrimination against spatially coherent displacement that this local Hausdorff allowance alone does not. For color, a two-pixel exclusion around reference solid boundaries removes the exact region where equivalent rasterizers legitimately move mixed edge pixels. Outside it, median ΔE00 <=1.0 brackets a generally imperceptible tone/rounding shift and p95 <=2.5 admits sparse scanner-inversion and 8-bit quantization residuals; wrong plate identity, dot gain, compositing order, or gamma-space rendering exceeds these controls. SSIM >=0.995 after area resampling at 2x, 4x, and 8x tolerates isolated pixel noise and alternative edge sampling while retaining sensitivity to missing geometry and spatially coherent defects at three scales. Proof pixels must exactly equal the normative rerender of the submitted plates, so those perceptual bands assess reconstruction accuracy rather than allowing an unrelated proof. SVG live text is checked for exact content, family, the explicit Regular/Bold font-weight mapping, point-size-equivalent SVG sizing, and position; text positions, QR module boxes, and dieline junctions use 0.05 mm (1.18 master-grid pixels at 600 dpi) bands, wide enough for decimal/vector serialization while limiting coordinate error to the stated 0.05 mm; the viewBox 1e-9 check only absorbs numeric parsing. PDF live-text spans are matched one-to-one to the recovered objects and checked for exact content, the selected embedded permitted font, the declared point size, their specified origins within 0.05 mm, and authoritative-font advance widths within 0.02 mm, so doubled or substituted typography cannot pass through substring extraction alone. XMP verification parses XML namespace semantics, accepts arbitrary namespace prefixes and either the disclosed namespaced-attribute or namespaced-element serialization, and requires the declared PDF/X version exactly. The complete four-element Separation array and Type 2 tint contract are read from the ticket; every no-ink endpoint must be the declared alternate white and every full-tint endpoint must equal the sRGB transfer of that plate's declared linear transmission. Each required spot also has to be an invoked full-canvas 8-bit image XObject whose decompressed samples exactly equal the corresponding submitted plate, so a nonsense tint, zero-area fill, or unrelated painted object fails. The verifier itself runs from a mandatory non-default CARTON_APP_ROOT and resolves normative /app ticket paths through that root, exercising path portability instead of silently falling back to the default instance. PDF box comparisons allow 0.01 point (0.0036 mm) for points-to-millimetres serialization, and rendered PDF-to-proof whole-page mean absolute RGB <=1.0 permits one 8-bit code value of compliant PDF image encoding and renderer/color-conversion rounding. The same <=1.0 bound is enforced over every sliding 4.0 mm square, preventing a localized mismatch from being diluted by the page area: the recovered oracle is pixel-identical at 600 dpi, while an 80-by-80-pixel adversarial image patch still passed the whole-page mean but produced local mean error 73.43 and was rejected. The simultaneous PDF structural checks ensure that these visual allowances cannot admit a flattened or semantically incorrect file."

