artifacts = ["/app/output.json"]  # paths the verifier reads from the agent (e.g. ["/app/output.json"]) — must be above the first [section]

[task]
name = "dynamo/macrocycle-isomer-census"  # required format: org/name (Harbor needs the slash); name part lowercase kebab-case, <=3 words
description = "Count exact substitution-pattern totals under symmetry, clash, composition, and contact-fingerprint constraints."                 # one-line summary of the task

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Mathematics and Formal Reasoning"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Combinatorics and enumeration"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["analyze"]                # e.g. ["implement", "debug"]
artifact_type = ["generated_output_artifact"]                 # e.g. ["codebase", "configuration_file"]
expert_time_estimate_hours = 20.0     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "The task requires expertise in group actions, Polya-Burnside orbit enumeration, exact content-constrained dynamic programming, and multivariate transition-count enumeration. Computational chemists and cheminformatics researchers use this reasoning to enumerate distinct macrocycle substitution isomers consistent with both steric exclusions and measured local-contact fingerprints. Across 35 synthetic instances, a solver must combine cyclic or dihedral stabilizers with exact compositions, wraparound clashes, self-contacts, and exact unordered edge-contact totals. The contact-constrained cases defeat the standard quotient path/cycle coloring reduction unless every contracted physical-edge multiplicity is retained: parallel quotient edges and reflection self-loops may contribute several contacts at once. Mishandling any multiplicity, closing edge, reflection class, or contact budget silently produces plausible but incorrect integers even when the unconstrained Burnside count is correct."        # why this task is hard for agents and humans
solution_explanation = "Apply Burnside's lemma to the cyclic or dihedral action, grouping rotations by cycle structure and handling reflection classes separately. For each group element, contract position cycles into weighted quotient nodes. Plain recipes use a mixed-radix composition DP over the resulting path or cycle. For recipes with contact fingerprints, retain the multiplicity of every physical edge between quotient nodes and every quotient self-loop, then augment the DP state with the exact accumulated count of each required unordered substituent pair. Node weights consume composition, quotient-edge multiplicities add cross-node contacts, self-loop multiplicities add same-node contacts, and the closing cycle edge is applied before accepting the target vector. Weight fixed-point counts by group-element multiplicity, sum them, divide by the group order, and emit one exact integer per recipe."          # high-level approach and key insights
verification_explanation = "tests/test_outputs.py checks, atomically: that /app/output.json exists, is not a symlink, and parses to a JSON object; that /app/input/ is byte-identical to a golden copy kept in tests/ (never visible to the agent); that the top-level schema is exactly {'isomer_counts': <object>}; that isomer_counts' keys are exactly the recipe_ids present in the input; that every value is a JSON integer and non-negative; and that every value exactly equals the corresponding value in tests/expected_output.json, with no tolerance anywhere."      # how the tests verify correctness

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at verify time; leave environment_mode unset for this shared model.

[agent]
timeout_sec = 3600.0               # allow correct but unoptimized solvers to finish

[environment]
build_timeout_sec = 600.0          # max seconds for the Docker build
cpus = 1                           # increase for parallel/compute-heavy workloads
memory_mb = 2048                   # increase for large datasets or in-memory processing
storage_mb = 10240                 # increase for tasks with large files or build artifacts
gpus = 0                           # max 1, expect H100
allow_internet = true              # open internet is available to the agent
mcp_servers = []                   # optional MCP servers to expose to the agent
