[task]
name = "dynamo/irrigation-world-model"
description = "Reconstruct spatially heterogeneous crop-water state and issue a deterministic variable-rate irrigation prescription."

[metadata]
category = "Games Puzzles and Interactive Simulation"
subcategory = "World simulation"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["mathematical_or_scientific_model", "dataset_or_tabular_file", "generated_output_artifact"]
expert_time_estimate_hours = 36.0
difficulty_explanation = "A precision-agriculture or geospatial modelling engineer must reconstruct four structurally different field seasons containing 6,663 clipped analysis units. Each campaign uses a distinct rectangular grid, a different number of management bands, rotated soil-survey partitions, per-unit irregular observation calendars, overlapping Polygon and MultiPolygon applications, and irregular field geometry that includes holes and a disconnected campaign. Root depth and soil-water capacity evolve every day, while the FAO-56 depletion fraction responds to potential crop demand before the stress-feedback recurrence. Small overlay or ordering errors therefore alter daily TAW and RAW, the first stressed day, later evapotranspiration, terminal depletion, management class, and field volume. The task requires a general geospatial time-series engine rather than one formula translated over four identical datasets."
solution_explanation = "Construct each ticket's affine grid and clip positive-area cells to Polygon or MultiPolygon fields. Precompute cell/soil intersection weights, interpolate the crop's daily root depth, integrate every map unit's horizon storage to that depth, and combine the resulting daily capacities by true overlap area. Independently interpolate each cell's vegetation observations, compute potential demand and the adjusted daily depletion threshold, area-weight all same-day irrigation parts, and advance the stress-coupled balance without intermediate rounding. Convert terminal state to the campaign-limited gross rate, classify it against that campaign's half-open bands, preserve clipped geometry, and reconcile all unit, field, and dynamic-zone aggregates."
verification_explanation = "The verifier fingerprints the complete generated input tree and independently reconstructs every campaign without importing solution code. Atomic tests enforce the three exact output schemas and ordering; compare identities, grid positions, Polygon/MultiPolygon geometries and areas; independently check growing-root soil capacities, adjusted daily thresholds, stress-feedback audit state, prescriptions, campaign-specific zones, CSV equivalence, and every field aggregate. A structural guard also requires four distinct grid sizes, multiple zone counts, rotated survey edges, disconnected field geometry, multipart events, strictly developing root curves, and many observation calendars. The oracle and independent verifier agree across all 6,663 units, while mixed absolute/relative tolerances retain headroom for valid float64 overlay and serialization differences."

