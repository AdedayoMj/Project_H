[task]
name = "dynamo/irrigation-world-model"
description = "Reconstruct spatially heterogeneous crop-water state and issue a deterministic variable-rate irrigation prescription."

[metadata]
category = "Games Puzzles and Interactive Simulation"
subcategory = "World simulation"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["mathematical_or_scientific_model", "dataset_or_tabular_file", "generated_output_artifact"]
expert_time_estimate_hours = 48.0
difficulty_explanation = "A precision-agriculture or geospatial modelling engineer must reconstruct six structurally different field seasons containing 9,751 clipped analysis units and deliver a reusable implementation that generalizes beyond those published values. The fixtures are deterministically synthesized rather than collected from real farms, but are designed to reproduce realistic field-season geometry, measurements, physical coupling, and operational constraints. The campaigns combine distinct rectangular grids, management bands, rotated soil partitions, irregular per-unit observation calendars, overlapping Polygon and MultiPolygon applications, holes, and disconnected fields. Every daily simulation couples a growing-root-zone FAO-56 water balance to a salt-load state: heterogeneous source-water EC and rainfall add salt, drainage removes a state-dependent fraction, salinity changes crop use, and that changed use feeds later water and concentration states. Terminal deficit and leaching demands are then coupled across every unit by a campaign-wide volume constraint and a state-derived weighted quadratic allocation. Small overlay, interpolation, state-order, salt-mass, or optimizer errors propagate into audits, terminal requests, the global Lagrange multiplier, thousands of allocated depths, zones, and summaries. A valid solution therefore needs a general geospatial time-series engine, coupled physical-state simulation, and deterministic constrained optimization rather than a fixed answer table."
solution_explanation = "Construct each affine grid and clip positive-area cells to Polygon or MultiPolygon fields. Precompute true cell/soil weights, interpolate daily root depth and vegetation, integrate layered capacity, and spatially weight same-day irrigation depth and its source-specific salt input. Advance depletion and salt load in the published order while recording both stress channels, drainage, and leaching. Form each terminal water-plus-leaching request and its priority, then solve the campaign-wide convex allocation with the specified 100-step multiplier search. Classify allocated depths, preserve geometries, serialize canonical unit records, and reconcile requested, budgeted, allocated, shortfall, field, and zone aggregates. Package the same implementation as the required solver artifact with parameterized input and output roots."
verification_explanation = "The verifier fingerprints the full generated input tree and independently reconstructs all six campaigns without importing solution code. Atomic tests enforce exact schemas, types, ordering, decimal CSV text, identities, Polygon/MultiPolygon overlays, soil integration, both coupled daily states, four seasonal audits, both stress counts, terminal demands and priorities, the nonlocal allocation, campaign zones, CSV equivalence, and every summary. Structural guards require six unique grids, topology variants, multipart events, varied calendars, deep drainage, salt stress, salt leaching, terminal EC variation, binding pump quotas, priority variation, and nonzero shortfalls in every campaign. Per-campaign normalized residual mean and RMS guards reject coherent pointwise-in-band bias, with explicit additive and multiplicative regression probes. The submitted solver is also run from arbitrary roots against a verifier-only counterfactual campaign that changes climate, initial water and salinity states, crop response, rainfall salinity, and pump budget; its three new artifacts receive the same independent value-level checks. The isolated builder is removed, and Oracle/Nop controls plus all 18 verifier tests cover the 9,751-unit published world and the held-out rerun."

