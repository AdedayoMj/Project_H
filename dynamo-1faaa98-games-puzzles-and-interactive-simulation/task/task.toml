[task]
name = "dynamo/robust-downlink-policy"
description = "Construct the unique robust spacecraft downlink plan across simultaneous weather and link scenarios."

[metadata]
category = "Games Puzzles and Interactive Simulation"
subcategory = "World simulation"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["mathematical_or_scientific_model", "dataset_or_tabular_file", "generated_output_artifact"]
expert_time_estimate_hours = 52.0
difficulty_explanation = "A flight-dynamics or operations-research engineer must synthesize one non-anticipative action sequence that remains meaningful in four simultaneous weather/link worlds. The five mission fixtures are synthetically generated by a deterministic seeded builder, with operationally realistic packet, contact, and resource interactions chosen to make late decisions consequential. Each decision couples expiring weighted packet queues to finite storage, saturating solar charge, a hard battery reserve, thermal memory, and sequence-dependent slew feasibility. Overflow and service use opposing priority orders, deadlines discard after service, idle slots preserve pointing history, and solar saturation means equal battery states need not have equal energy objectives. Local greedy choices therefore alter dozens of later queue and resource states. Exact lexicographic optimization, deterministic final tie-breaking, per-scenario replay, and generalization to an unseen mission require a substantial dynamic-programming or branch-and-bound implementation rather than a standard scheduler invocation."
solution_explanation = "Parse each mission into integer batches and per-slot actions. Carry a dynamic-programming state containing shared battery, thermal and pointing history together with every scenario's remaining batches and class loss ledgers. Apply release overflow, charge/cooling, feasibility, scenario service, and deadline expiry in the specified order. Index merge labels by both physical state and peak thermal history; within an equal state/peak bucket retain the best energy/contact/path prefix, then select the final state by the full robust comparison key. Replay the winning action sequence to construct slot audits, scenario outcomes, objective components, and the canonical digest before writing the JSON, flat CSV, certificate, and reusable solver."
verification_explanation = "The verifier hash-locks the generated mission evidence, closes every JSON and CSV schema, checks canonical manifest/slot/scenario ordering, and independently replays resource and packet transitions for the submitted action sequence. A separately organized exact optimizer pins the unique action sequence and all loss/objective values; direct checks recompute battery reserve, thermal limit, slew reachability, service priority, overflow/expiry losses, energy, extrema, counts, cross-artifact equality, and SHA-256. Regression probes preserve distinct peak histories through state convergence and reject feasible-but-suboptimal and nominal-only plans. Finally an isolated runner denies access to verifier files and process/network escapes, proves that guard with adversarial probes, and grades the reusable solver on a private mission whose packet timing, solar, pointing, contacts, and resource limits differ from the published fixtures. All quantities are integral, so acceptance uses exact equality rather than numerical tolerances."

