[task]
name = "dynamo/pump-contingency-frontier"
description = "Reconstruct coupled field state and certify a multi-policy irrigation response frontier across pump contingencies."

[metadata]
category = "Games Puzzles and Interactive Simulation"
subcategory = "World simulation"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["mathematical_or_scientific_model", "dataset_or_tabular_file", "generated_output_artifact"]
expert_time_estimate_hours = 48.0
difficulty_explanation = "A precision-agriculture or geospatial modelling engineer must reconstruct six structurally different, deterministically synthesized field seasons containing roughly ten thousand clipped units. The fixtures are synthetic rather than farm records, but deliberately reproduce realistic boundary topology, layered soil partitions, observation gaps, overlapping applications, growing root zones, and operational scarcity. Each daily water state changes salt concentration, salinity changes crop use, and drainage changes salt mass. Those terminal states feed four different scarcity policies whose priorities and budgets change together, plus a full-recovery point. A small overlay, interpolation, state-order, or salt-mass error therefore propagates into five nonlocal optimizers, activation and satisfaction transitions, shadow prices, weighted losses, and cross-scenario certificates. The reusable solver must also generalize to an unseen policy/world perturbation rather than replay the published frontier."
solution_explanation = "Clip the affine grids to each field, area-weight layered soil storage, interpolate root depth and vegetation, and advance the coupled water/salt state without intermediate rounding. Derive terminal water, salt, and stress-history needs. For each ticket policy, rebuild priorities, apply its fraction of nominal pump capacity, and solve the bounded campaign-wide quadratic allocation with the canonical multiplier search; append the full-request recovery point. Derive activation, satisfaction, robustness, and frontier gain per unit, then independently reconcile each KKT-style scenario certificate before serializing geometry, the flat table, and the reusable solver."
verification_explanation = "The verifier fingerprints the generated evidence and independently reconstructs all physical states and all five frontier points without importing solution code. It checks exact schemas, types, canonical order, decimal CSV syntax, identity and overlay geometry, soil integration, daily water/salt audits, need decomposition, all scenario priorities/depths/shortfalls, frontier labels and ratios, and every certificate value. Direct invariants enforce increasing scenario budgets and allocated volumes, full recovery, binding scarcity points, positive transitions, budget closure, shortfall reconciliation, objective recomputation, and shadow-price stationarity. Campaign-level normalized residual guards reject coherent in-band bias. Finally, an isolated runner denies the submitted solver access to verifier files and process/network escapes, proves the oracle-read guard with an adversarial probe, and executes the solver from relocated roots on a verifier-only counterfactual with transformed field/event geometry, grid origin and cell dimensions, state drivers, capacity, and policy factors before grading its entire frontier again."

