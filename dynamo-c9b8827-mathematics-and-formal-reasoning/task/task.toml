difficulty_explanation = "A combinatorial-design researcher or mathematical bioinformatician must enumerate constrained 24-by-12 incidence matrices under a full action of order 483,729,408. The synthetic instance has eight blinded three-sample cohorts on two hexagonal plates, 1,350 admissible normalized cohort partitions, exact pool capacities, per-plate balance, and separation after every one- and two-pool loss. Its raw ordered class space is far beyond post-filter enumeration. Twenty-eight ordered pair restrictions use canonical two-plate 3-by-3 contingency profiles under independent row/column S3 actions and plate exchange; these interact with eight pool-orbit domains and a ternary 27-value XOR spectrum. The residual 288-element wreath-product plate action, fixed-width permutation words, canonical encodings, stabilizers, 27 conjugacy classes, Burnside fixed counts, and 6^8 sample orderings must use exactly the disclosed conventions. Plausible programs fail by treating a three-way partition as a complementary pair, transposing ordered pair profiles, canonicalizing each plate separately, checking only one lost pool, omitting the ternary rule, brute-force post-filtering, or using non-invariant pruning."
solution_explanation = "Generate the 1,350 balanced unordered three-signature cohort partitions by combining labelled 2-2-2 partitions on both plates and quotienting the within-cohort S3 action. Close the five pool generators to the 288-element action, then precompute its class action and each class's canonical pool-orbit ID. Cache canonical ordered contingency profiles under 72 row/column/plate transformations. Search the eight ordered cohort variables using minimum-remaining-values selection, distinct-class and orbit-domain propagation, and every currently activated pair and ternary XOR-spectrum rule. Check all one- and two-column deletions for each completion. Partition normalized designs into pool-group orbits, encode canonical representatives, compute stabilizers, derive the labelled count through 6^8 sample orderings, form exact residual conjugacy classes, count fixed designs, and reconcile orbit–stabilizer and Burnside."
verification_explanation = "The verifier fingerprints `/app/input/pooling.json`, validates the exact schema and integer types, independently closes all generators, and reconstructs all 1,350 balanced three-sample cohort partitions. It decodes every representative and checks disjoint exhaustive cohort rows, replication, plate balance, capacity, all one- and two-column deletions, pool-orbit IDs, every ordered pair contingency profile, the ternary XOR spectrum, canonicality, sorting, and uniqueness. A separate propagation enumeration reconstructs the complete representative set, stabilizers, all 27 conjugacy classes, and fixed-design counts, then verifies both orbit–stabilizer identities, Burnside's lemma, exact totals, and the canonical digest."

