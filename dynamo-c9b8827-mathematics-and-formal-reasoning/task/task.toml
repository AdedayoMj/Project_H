difficulty_explanation = "A combinatorial-design researcher or mathematical bioinformatician must enumerate constrained 24-by-18 incidence matrices under a full action of order 120,932,352. The synthetic instance has eight blinded three-sample cohorts on three hexagonal plates, 121,500 admissible normalized cohort partitions (90 times the prior instance), exact capacities, per-plate balance, and separation after every one- and two-pool loss. Its raw ordered class space and full pair-compatibility table are infeasible to post-filter or materialize. Twenty-eight ordered pair restrictions require canonical three-plate 3-by-3 contingency profiles under 216 row/column/plate transformations. Six overlapping ternary XOR spectra interact with four independent fourth-order rules that jointly encode coverage-union and folded-XOR weights over 81 choices; satisfying either family alone is insufficient. The residual synchronized D6 x S3 pool action, fixed-width 18-point permutation words, canonical encodings, stabilizers, 18 conjugacy classes, Burnside fixed counts, and 6^8 sample orderings must use exactly the disclosed conventions. Plausible programs fail by generating labelled partitions without quotienting, materializing quadratic compatibility, transposing ordered pair profiles, allowing independent spatial actions by plate, using the maximum occupied bit as the width, omitting one higher-order rule family, checking only one lost pool, or applying non-invariant pruning."
solution_explanation = "Generate the 121,500 balanced unordered three-signature cohort partitions by combining labelled 2-2-2 partitions on all three plates and quotienting the within-cohort S3 action. Close the four disclosed pool generators to the 72-element synchronized D6 x S3 action, precompute mask images and the induced class action, and recover each restricted domain from its canonical orbit representative without scanning every class orbit repeatedly. Cache canonical ordered contingency profiles under 216 row/column/plate transformations. Search the eight ordered cohort variables using minimum-remaining-values selection, distinct-class and orbit-domain propagation, all active pair rules, six ternary XOR spectra, and four fourth-order union/XOR spectra. Check every one- and two-column deletion for each completion. Partition normalized designs into pool-group orbits, encode canonical representatives, compute stabilizers, derive the labelled count through 6^8 sample orderings, form exact residual conjugacy classes, count fixed designs, and reconcile orbit–stabilizer and Burnside."
verification_explanation = "The verifier fingerprints `/app/input/pooling.json`, validates the exact schema and integer types, independently closes all generators, and reconstructs all 121,500 balanced three-sample cohort partitions. It decodes every representative and checks disjoint exhaustive cohort rows, replication, three-plate balance, capacity, all one- and two-column deletions, pool-orbit IDs, all 28 ordered pair contingency profiles, six ternary XOR spectra, four fourth-order union/XOR spectra, canonicality, sorting, and uniqueness. An independent propagation enumeration reconstructs the complete representative set, stabilizers, all 18 conjugacy classes, and fixed-design counts, then verifies both orbit–stabilizer identities, Burnside's lemma, exact totals, and the canonical digest."

