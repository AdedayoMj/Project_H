difficulty_explanation = "A combinatorial-design researcher or mathematical bioinformatician must enumerate constrained 30-by-18 incidence matrices under a full action of order 4,353,564,672. Each of ten ordered cohorts ranges over a disclosed orbit inside 121,500 admissible balanced cohort partitions. Exact capacity and two-pool-loss separation interact with 45 ordered contingency constraints generated from every one of 100 cross-witness pairings, leaving as many as 33 locally valid profiles. Eight ternary constraints mix 90 witness tuples each and admit 34-48 spectra; six fourth-order constraints mix 80 tuples each and admit 75-80 union/XOR spectra. Five GF(2) deletion-rank histograms over all 172 zero-, one-, and two-column losses add overlapping global coupling but still leave dozens of exact symmetry classes. Exhaustive search repeats across 72 equivalent pool images unless the solver proves and exploits a regular-orbit transversal before CSP enumeration. It must then recover normalized and 6^10-labelled counts, canonical representatives, stabilizers, 18 conjugacy classes, and Burnside fixed counts using every disclosed convention. Plausible programs time out by materializing compatibility, treating decoy values as aligned witnesses, delaying symmetry reduction, computing rank over reals, or omitting one higher-order family."
solution_explanation = "Generate the 121,500 balanced unordered cohort partitions from labelled 2-2-2 plate partitions modulo within-cohort S3. Close the pool generators to synchronized D6 x S3 of order 72, precompute the induced class action, and recover orbit domains from their representatives. Prove that the first regular 72-class cohort orbit is a transversal: fix that cohort to its canonical orbit representative during search, then expand each rooted completion under all 72 pool actions to restore the normalized pre-quotient set. Cache ordered contingency profiles under all 216 row/column/plate transformations. Search the remaining cohort variables with MRV, distinctness, fully mixed pair rules, eight broad ternary XOR spectra, six broad union/XOR spectra, and five deletion-rank histograms computed by bitwise Gaussian elimination over GF(2). Check all one- and two-column losses, then compute canonical encodings, stabilizers, labelled counts through 6^10 sample orders, residual conjugacy classes, fixed sets, orbit-stabilizer identities, and Burnside."
verification_explanation = "The verifier fingerprints `/app/input/pooling.json`, validates exact schema and integer types, independently closes the generators, and reconstructs all 121,500 balanced cohort partitions. It separately proves the regular anchor orbit, enumerates one exact transversal slice, expands it under the group, and checks every decoded representative for replication, plate balance, capacity, every one- and two-column deletion, pool-orbit IDs, all 45 mixed pair profiles, eight ternary spectra, six union/XOR spectra, and five GF(2) deletion-rank histograms. It reconstructs the complete representative set, stabilizers, all 18 conjugacy classes, and fixed-design counts, then verifies both orbit-stabilizer identities, Burnside's lemma, exact totals, canonicality, sorting, uniqueness, and the pinned artifact digest."

