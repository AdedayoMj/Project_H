[task]
name = "dynamo/sokoban-move-optimal"
description = "Compute canonical move-optimal Sokoban solutions and count all tied optima."

[metadata]
category = "Games Puzzles and Interactive Simulation"
subcategory = "Board and card games"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "optimize", "generate"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 32.0
difficulty_explanation = "A heuristic-search engineer must prove a three-level optimum across sixteen synthetic Sokoban instances: minimum player moves, then minimum pushes, then the lexicographically smallest complete move string under D < L < R < U. The task must additionally count, modulo 1,000,000,007, every distinct move string tied on the first two levels. Eight instances provide broad four-to-five-box coverage, while eight independently seeded six-box hard-tail instances require at least 120,000 reference expansions. Push-graph A* avoids the memory blow-up of player-step breadth-first search, but ordinary move-only transposition tables are insufficient: equal-move labels can differ in pushes, canonical prefixes, and path multiplicity. Counting also requires recognizing that one push edge can have several distinct shortest setup walks, then propagating those multiplicities without double-counting merged states. A conventional optimal solver can therefore return a legal shortest solution yet fail both the canonical and counting requirements. Correctness still depends on an admissible push-distance matching bound and conservative deadlock pruning."
solution_explanation = "Parse each board and precompute reverse push distances from every goal. Search states consisting of the player cell and box set, with each edge representing one push preceded by a shortest walk to its standing square. For every reachable standing square, breadth-first search records both the canonical D/L/R/U shortest walk and the number of shortest walks. Label each push state primarily by total moves and secondarily by pushes, accumulate counts modulo 1,000,000,007 when an equal label arrives, and separately retain the smallest complete move-string prefix. A consistent box-to-goal assignment heuristic ensures all equal-label predecessors are processed before their state, so multiplicities are final when propagated. Continue after the first goal until no queue item can attain its move count, sum all minimum-move/minimum-push goal labels, and select their smallest string."
verification_explanation = "The deterministic builder accepts eight standard instances inside a 150,000-expansion envelope and eight independently seeded six-box hard-tail instances only after 120,000 to 450,000 reference expansions. The verifier hashes every board and rules.json, cross-checks the fixture schema, puzzle IDs, and count against that normative document, enforces the exact JSON schema and puzzle ordering, and independently replays every move string from a relocated application root. It requires the hidden optimal move count, hidden minimum push count, SHA-256 digest of the unique canonical move string, and hidden modulo count of all distinct solutions tied on moves and pushes. The digest reveals no answer while preventing alternative tied solutions from passing; the separately generated count catches solvers that retain only one equal-cost predecessor or ignore multiple shortest setup walks. The image build removes its isolated generator directory and fails if builder source or bytecode remains anywhere in the image. All sixteen puzzles must satisfy every check."

