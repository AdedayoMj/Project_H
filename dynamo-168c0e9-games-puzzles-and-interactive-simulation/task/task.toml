[task]
name = "dynamo/sokoban-push-frontier"
description = "Audit every reachable Sokoban opening push for conditional optimality, regret, solvability, and completion multiplicity."

[metadata]
category = "Games Puzzles and Interactive Simulation"
subcategory = "Board and card games"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "optimize", "generate"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 40.0
difficulty_explanation = "A heuristic-search engineer must construct a complete counterfactual policy surface rather than find one route. Every box/direction pair reachable as the first push is a separate commitment, including branches that are legal initially but cannot be completed. Each solvable branch needs an independently certified four-level optimum: moves, pushes, push-direction changes, and canonical move-string order, plus the multiplicity of all strings tied on the numeric objectives. The player-to-box setup walk is not fixed, so shortest-walk multiplicities must be folded into each branch count. Regret then couples every branch to the best opening for the same board. Ten deterministic four-to-six-box boards include broad open frontiers and a six-box hard tail screened above 120,000 expansions. A solver that keeps only the globally best opening, conflates box pushes sharing a direction, drops deadlocking choices, forgets the previous push direction, or counts only one setup walk will produce a plausible but structurally incomplete audit."
solution_explanation = "Enumerate reachable standing cells without moving boxes, then identify every legal first push by the box's original coordinate and direction. Apply each commitment and solve the resulting state with push-graph A*, carrying the previous push direction in the state. Push edges contain a shortest setup walk and one push; labels compare total moves, pushes, and direction changes, while a separate string label preserves the D/L/R/U canonical representative. Equal labels accumulate multiplicities modulo 1,000,000,007, including the number of shortest walks before the committed push. Exhausting a branch proves it unsolvable. After all branches finish, take the minimum conditional move cost and derive each solvable branch's regret."
verification_explanation = "The deterministic builder proves the full reachable first-push frontier for every accepted board under a per-commitment 1,800,000-expansion cap. Fixture invariants require many positive-regret and unsolvable commitments and several puzzles with multiple regret-zero openings. The hidden fixture records exact commitment identities, conditional metrics, modular counts, canonical-completion digests, board hashes, and the rules hash. The verifier independently flood-fills the initial player region to reconstruct frontier membership, enforces exact nested JSON schemas and ordering, replays each solvable completion, identifies its actual first pushed box, and checks solving, move/push/direction-change metrics, regret, canonical digest, and count. Null-shape checks cover unsolvable branches. The image deletes all generator and shared-solver source after construction."

