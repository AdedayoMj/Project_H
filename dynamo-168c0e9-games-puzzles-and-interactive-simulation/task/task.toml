[task]
name = "dynamo/sokoban-move-optimal"
description = "Compute canonical move-optimal Sokoban solutions and count all tied optima."

[metadata]
category = "Games Puzzles and Interactive Simulation"
subcategory = "Board and card games"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "optimize", "generate"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 32.0
difficulty_explanation = "A heuristic-search engineer must prove a four-level optimum across ten deterministically generated synthetic Sokoban instances: minimum player moves, then minimum pushes, then minimum changes between consecutive push directions, then the lexicographically smallest complete move string under D < L < R < U. The task must additionally count, modulo 1,000,000,007, every distinct move string tied on the first three levels. Eight instances provide broad four-to-five-box coverage, while two independently seeded six-box hard-tail instances require at least 120,000 move-optimal screening expansions. Push-graph A* avoids the memory blow-up of player-step breadth-first search, but an ordinary player-and-box transposition table is now unsound: identical positions reached with different last push directions have different future tertiary costs. Equal numeric labels can also differ in canonical prefixes and path multiplicity, and one push edge can represent several shortest setup walks. A conventional optimal solver can therefore finish every board yet report the wrong tertiary optimum, canonical representative, or tied count. Correctness still depends on an admissible push-distance matching bound and conservative deadlock pruning. This mirrors paid work by heuristic-search researchers and puzzle-engine developers who build benchmark solvers, calibrate generated instances, and certify multiobjective optimality or solution multiplicity."
solution_explanation = "Parse each board and precompute reverse push distances from every goal. Search states consisting of the player cell, box set, and preceding push direction, with each edge representing one push preceded by a shortest walk to its standing square. For every reachable standing square, breadth-first search records both the canonical D/L/R/U shortest walk and the number of shortest walks. Label each state by total moves, pushes, and push-direction changes; accumulate counts modulo 1,000,000,007 when an equal numeric label arrives, and separately retain the smallest complete move-string prefix. A consistent box-to-goal assignment heuristic ensures all equal-label predecessors are processed before their state, so multiplicities are final when propagated. Continue after the first goal until no queue item can attain its move count, sum goal labels tied on all three numeric objectives, and select their smallest string."
verification_explanation = "The deterministic builder screens eight standard instances inside a 150,000-expansion envelope and two independently seeded six-box hard-tail instances only after 120,000 to 450,000 move-optimal screening expansions, then proves the richer four-level objective inside a separate 1,800,000-expansion cap. It also solves every accepted board under the former moves/pushes objective and retains fixtures where the added push-direction-change level changes the canonical representative or tied count, proving the new criterion is exercised rather than decorative. The generated held-out fixture carries a machine-checked contract recording all ten puzzle IDs, exact hidden/submitted key sets, and count modulus; the verifier requires agreement with rules.json before grading. It hashes every board and rules.json, enforces exact JSON schema/order, and independently replays every move string from a relocated root. It requires hidden optimal move, push, and push-direction-change counts, the canonical-string SHA-256, and the hidden modulo count of strings tied on all three numeric levels. The image build removes generator source and bytecode. All ten puzzles must satisfy every check."

