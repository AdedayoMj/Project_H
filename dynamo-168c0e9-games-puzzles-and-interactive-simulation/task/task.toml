artifacts = [
  "/app/output/rescue_policy.json",
  "/app/output/solver.py",
]

[task]
name = "dynamo/belief-rescue-policy"
description = "Synthesize exact minimax policies for partially observable two-team disaster-response networks."

[metadata]
category = "Games Puzzles and Interactive Simulation"
subcategory = "World simulation"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze", "optimize", "generate"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 56.0
difficulty_explanation = "A planning and formal-methods engineer must synthesize a closed controller over belief states, not a route through one known graph. The ten deterministically generated synthetic networks are designed to resemble realistic incident-response uncertainty while remaining fully auditable: two teams have asymmetric costs, bridge availability depends on an unknown disaster mode, sensors expose different partitions, failed traversals reveal information, and four rescues couple distant decisions. Correctness requires AND/OR reasoning over every observation branch, minimax dynamic programming through cycles, a three-level resource objective, actor-memory handoff accounting, local optimal-action multiplicities, canonical action selection, stable state hashing, graph closure, and policy digests. Greedy shortest paths, solving modes separately, summing rather than maximizing branch resources, forgetting failed-action state, or emitting only one trace all produce plausible but invalid artifacts."
solution_explanation = "Represent a belief node by both team positions, rescued mask, possible-mode bitset, and previous actor. Generate scan partitions and arrived/blocked move partitions exactly. Use turn-bounded memoized AND/OR dynamic programming so cycles cannot claim progress; for each action require every observation successor to be winning, combine successor resource values by componentwise maxima, add action costs, and compare the resulting vectors lexicographically. Increase the bound until the first strong value exists, count all actions tied on that vector, retain the canonical action, and traverse its observation successors to materialize the closed policy graph. Canonicalize state documents and the sorted node array for their hashes."
verification_explanation = "The verifier hash-locks every generated arena and independently reconstructs action availability, belief partitions, rescue transitions, resource costs, minimax values, local optimal-action counts, and canonical actions. It checks exact nested schemas, ordering, state digests, root identity, graph closure, policy digest, and arena summaries; it then exhaustively follows every mode-compatible branch to a goal while rejecting cycles or missing observations. Structural tests require varied modes, sensors, uncertain edges, asymmetric teams, branching policies, both teams acting, and blocked/arrived outcomes. Finally, the submitted solver runs from arbitrary roots on multiple verifier-only counterfactual arenas, including a separately constructed case with new node and mode counts, and every result is compared field-for-field with the independent model."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 3600.0

